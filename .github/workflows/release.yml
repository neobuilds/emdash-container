name: EmDash immutable image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: emdash-image
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: emdash-test:${{ matrix.arch }}
          provenance: false
      - name: Native runtime qualification
        run: python3 runtime-test.py emdash-test:${{ matrix.arch }} ${{ matrix.arch }}
      - name: Audit every image layer and config before publication
        run: python3 audit-image.py emdash-test:${{ matrix.arch }} audit-${{ matrix.arch }}.json
      - name: Push immutable candidate by digest
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/neobuilds/emdash,push-by-digest=true,name-canonical=true,push=true
          provenance: false
      - name: Record digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: printf '%s' "$DIGEST" > digest-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: emdash-${{ matrix.arch }}
          path: |
            digest-${{ matrix.arch }}
            runtime-${{ matrix.arch }}.json
            audit-${{ matrix.arch }}.json
  index:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: emdash-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit-addressed index
        run: docker buildx imagetools create -t ghcr.io/neobuilds/emdash:1.1.0-${{ github.sha }} "ghcr.io/neobuilds/emdash@$(cat digest-amd64)" "ghcr.io/neobuilds/emdash@$(cat digest-arm64)"
